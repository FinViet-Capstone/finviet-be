name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FinViet.sln

      - name: Build
        run: dotnet build FinViet.sln --configuration Release --no-restore

      # Domain/Application unit tests use the EF Core InMemory provider and need no database.
      # Integration tests (tests/FinViet.Api.IntegrationTests) hit a real running server/DB and are
      # intentionally not run here.
      - name: Test — Domain
        run: dotnet test tests/FinViet.Domain.UnitTests --configuration Release --no-build

      - name: Test — Application
        run: dotnet test tests/FinViet.Application.UnitTests --configuration Release --no-build

  deploy:
    name: Trigger Render deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Render API
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 300 ]; then
            echo "Render API returned HTTP $http_code:"
            echo "$body"
            exit 1
          fi

          deploy_id=$(echo "$body" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Could not parse deploy id from Render response:"
            echo "$body"
            exit 1
          fi

          echo "Triggered Render deploy $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          # Render builds/deploys the Docker image itself; a cold build can take several minutes.
          max_attempts=60
          sleep_seconds=15

          for attempt in $(seq 1 "$max_attempts"); do
            body=$(curl -sS -X GET \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")

            status=$(echo "$body" | jq -r '.status')
            echo "[$attempt/$max_attempts] deploy status: $status"

            case "$status" in
              live)
                echo "Deploy succeeded."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Deploy failed with status: $status"
                echo "$body"
                exit 1
                ;;
            esac

            sleep "$sleep_seconds"
          done

          echo "Timed out waiting for deploy $DEPLOY_ID to finish."
          exit 1
