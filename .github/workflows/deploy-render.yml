name: Deploy to Render

# Triggers on `dev` because that is the branch the Render service builds — `dev` is the release
# branch here, not `main`.
#
# This used to trigger on `main`, which made deploys silently ship the wrong code: the Render API
# call below deploys whatever branch the *service* is configured for, so merging into `main` ran
# the pipeline green while Render rebuilt `dev` and released code that was never in the merge.
# That is exactly how PR #83's changes sat unreleased for two days while CI reported success.
# Keep this branch list in sync with the Render service's branch setting.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FinViet.sln

      - name: Build
        run: dotnet build FinViet.sln --configuration Release --no-restore

      # Domain/Application unit tests use the EF Core InMemory provider and need no database.
      # Integration tests (tests/FinViet.Api.IntegrationTests) hit a real running server/DB and are
      # intentionally not run here.
      - name: Test — Domain
        run: dotnet test tests/FinViet.Domain.UnitTests --configuration Release --no-build

      - name: Test — Application
        run: dotnet test tests/FinViet.Application.UnitTests --configuration Release --no-build

  deploy:
    name: Trigger Render deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Render API
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 300 ]; then
            echo "Render API returned HTTP $http_code:"
            echo "$body"
            exit 1
          fi

          deploy_id=$(echo "$body" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Could not parse deploy id from Render response:"
            echo "$body"
            exit 1
          fi

          echo "Triggered Render deploy $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          # Render builds/deploys the Docker image itself; a cold build can take several minutes.
          max_attempts=60
          sleep_seconds=15

          for attempt in $(seq 1 "$max_attempts"); do
            body=$(curl -sS -X GET \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")

            status=$(echo "$body" | jq -r '.status')
            echo "[$attempt/$max_attempts] deploy status: $status"

            case "$status" in
              live)
                # Render deploys its own configured branch, not necessarily the commit this run
                # tested. When those differ, the pipeline goes green while shipping something
                # else entirely — the failure mode that hid PR #83 for two days. Surface the
                # deployed commit either way, and flag a mismatch loudly enough to notice.
                deployed_sha=$(echo "$body" | jq -r '.commit.id // "unknown"')
                echo "Deploy succeeded. Render released commit: $deployed_sha"
                {
                  echo "### Render deploy"
                  echo ""
                  echo "- Workflow commit: \`${GITHUB_SHA}\`"
                  echo "- Deployed commit: \`${deployed_sha}\`"
                } >> "$GITHUB_STEP_SUMMARY"

                if [ "$deployed_sha" != "unknown" ] && [ "$deployed_sha" != "$GITHUB_SHA" ]; then
                  echo "::warning title=Deployed commit differs from tested commit::Render released $deployed_sha but this run built and tested $GITHUB_SHA. Check that the Render service's branch matches this workflow's trigger branch."
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "> **Mismatch** — Render released a different commit than this run tested." >> "$GITHUB_STEP_SUMMARY"
                  echo "> Check the Render service's branch setting against this workflow's \`on.push.branches\`." >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Deploy failed with status: $status"
                echo "$body"
                exit 1
                ;;
            esac

            sleep "$sleep_seconds"
          done

          echo "Timed out waiting for deploy $DEPLOY_ID to finish."
          exit 1
